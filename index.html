<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 포트폴리오</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; background: #f1f5f9;
      font-family: sans-serif; text-align: center;
    }
    .card {
      background: white; width: 90%; max-width: 400px;
      padding: 40px; border-radius: 20px;
    }
    h1 { color: #1e293b; }
    button {
      border: 0; padding: 14px 24px; background: #2563eb;
      color: white; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>나의 포트폴리오</h1>
    <p>안녕하세요! UI/UX와 웹개발을 공부하고 있습니다.</p>
    <p>Figma · HTML · CSS</p>
    <button onclick="sayHello()">인사하기</button>
    <p id="message"></p>
  </main>
  <script>
    function sayHello() {
      document.getElementById("message").textContent =
        "제 첫 번째 웹사이트에 오신 것을 환영합니다!";
    }
  </script>
</body>
</html>
